name: Build FUTURO AI APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        uses: xavierfoucrier/html-to-android-action@v2.0.0
        with:
          app_name: FUTURO-AI
          app_package: com.futuroai.app
          app_version: 1.0.0
          app_url: ./index.html
      - uses: actions/upload-artifact@v4
        with:
          name: FUTURO-AI-APK
          path: app-debug.apk
